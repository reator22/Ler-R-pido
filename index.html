<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitura Rápida Mágica</title>
    <!-- Importar fontes do Google (Incluindo a nova fonte manuscrita ligada) -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Dancing+Script:wght@700&family=Lora:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f9f4; 
            --panel-bg: #ffffff;
            --reading-bg: #fffdf2; 
            --text-reading-color: #2c3e50; 
            --speed: 30s; 
            --font-size: 120px; /* Tamanho inicial muito maior */
            --font-family: 'Comic Neue', cursive;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: #333;
            overflow: hidden; 
        }

        /* Painel de Controlo Compacto */
        #control-panel {
            background-color: var(--panel-bg);
            padding: 12px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #555;
        }

        input[type="range"], select, input[type="color"] {
            height: 28px;
            border-radius: 6px;
            border: 1px solid #ddd;
            cursor: pointer;
        }

        input[type="color"] {
            width: 35px;
            padding: 0;
            border: none;
            background: none;
        }

        textarea {
            width: 220px;
            height: 38px;
            resize: none;
            border: 2px solid #eee;
            border-radius: 8px;
            padding: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        textarea:focus { border-color: #ffd700; outline: none; }

        .buttons-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        button {
            background-color: #ffd700;
            border: none;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.1s;
        }
        button:active { transform: scale(0.90); box-shadow: 0 2px 3px rgba(0,0,0,0.1); }
        button:hover { background-color: #ffea00; }

        .divider {
            height: 30px;
            width: 2px;
            background-color: #eee;
        }

        /* Área de Leitura Central */
        #reading-area {
            flex-grow: 1;
            background-color: var(--reading-bg);
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden; 
            /* Nova borda contínua à volta de todo o ecrã de leitura */
            border: 6px solid #ffd700;
            margin: 20px;
            border-radius: 25px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.02);
        }

        #scrolling-text {
            white-space: nowrap; 
            position: absolute;
            font-size: var(--font-size);
            font-family: var(--font-family);
            color: var(--text-reading-color);
            
            /* Anti-tremido */
            will-change: transform;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            backface-visibility: hidden;
            
            animation: scrollText var(--speed) linear infinite;
        }

        @keyframes scrollText {
            0% { left: 100%; transform: translate3d(0, 0, 0); }
            100% { left: 0; transform: translate3d(-100%, 0, 0); }
        }

        /* Ajustes para Telemóvel */
        @media (max-width: 900px) {
            #control-panel { flex-direction: column; align-items: stretch; gap: 12px; padding: 15px; }
            .control-group, .buttons-group { justify-content: space-between; width: 100%; }
            textarea { width: 100%; }
            .divider { display: none; }
            #reading-area { margin: 10px; border-radius: 15px; }
        }
    </style>
</head>
<body>

    <!-- PAINEL DE CONTROLO -->
    <div id="control-panel">
        
        <div class="control-group">
            <label for="speed-slider">🏃 Tempo:</label>
            <input type="range" id="speed-slider" min="10" max="90" value="30" dir="rtl" title="Ajusta o ritmo de leitura"> 
        </div>

        <div class="control-group">
            <label for="size-slider">🔍 Letra:</label>
            <!-- Barra invertida (dir="rtl") com máximo aumentado para suportar letras ainda maiores -->
            <input type="range" id="size-slider" min="40" max="250" value="120" dir="rtl" title="Ajusta o tamanho das letras">
        </div>

        <div class="control-group">
            <label for="font-select">✍️ Fonte:</label>
            <select id="font-select">
                <option value="'Comic Neue', cursive">Escola Básica</option>
                <option value="'Lora', serif">Livro Clássico</option>
                <!-- Fonte manuscrita de caligrafia escolar atualizada -->
                <option value="'Dancing Script', cursive">Manuscrito Escolar</option>
            </select>
        </div>

        <div class="control-group">
            <label for="text-color">🖍️ Cor:</label>
            <input type="color" id="text-color" value="#2c3e50" title="Cor do texto">
        </div>

        <div class="control-group">
            <label for="bg-color">🎨 Fundo:</label>
            <input type="color" id="bg-color" value="#fffdf2" title="Cor do fundo">
        </div>

        <div class="divider"></div>

        <div class="control-group">
            <textarea id="custom-text" placeholder="Escreve o teu texto aqui..."></textarea>
        </div>

        <div class="buttons-group">
            <span style="font-size: 14px; font-weight: bold; color: #555;">Magia:</span>
            <button onclick="setRandomText('dinossauros')" title="História de Dinossauros">🦖</button>
            <button onclick="setRandomText('espaco')" title="História do Espaço">🚀</button>
            <button onclick="setRandomText('musica')" title="História sobre Música">🎸</button>
            <button onclick="setRandomText('adivinhas')" title="Adivinhas">❓</button>
        </div>

    </div>

    <!-- ÁREA DE LEITURA -->
    <div id="reading-area">
        <div id="scrolling-text">Olá! Clica nos botões mágicos lá em cima para lermos uma história nova!</div>
    </div>

    <script>
        // BANCO DE HISTÓRIAS
        const textosMagicos = {
            dinossauros: [
                "Era uma vez um pequeno T-Rex chamado Dino que adorava brincar às escondidas, mas como tinha uma cauda gigante, os seus amigos descobriam-no sempre atrás das árvores da floresta húmida.",
                "Há muitos milhões de anos, o valente Triceratops acordou com muita fome e caminhou pelo vale até encontrar um arbusto cheio das folhas verdes e suculentas de que ele tanto gostava.",
                "O Braquiossauro era tão alto, mas tão alto, que o seu pescoço parecia um escorrega gigante. Ele adorava comer as folhas fresquinhas que ficavam no topo das árvores mais altas da montanha.",
                "Numa tarde de muito calor, um dinossauro voador chamado Pterodáctilo abriu as suas enormes asas e voou por cima dos vulcões adormecidos para procurar peixe no rio cristalino.",
                "A mãe Estegossauro tinha umas placas muito esquisitas nas costas que mudavam de cor quando ela estava zangada, mas hoje estavam cor-de-rosa porque ela estava muito feliz a brincar com as suas crias."
            ],
            espaco: [
                "O astronauta João vestiu o seu fato espacial brilhante, colocou o capacete redondo, entrou no foguetão prateado e descolou em direção às estrelas para tentar descobrir se a Lua era mesmo feita de queijo.",
                "Na galáxia distante, o planeta Marte estava muito triste porque era sempre chamado de planeta vermelho, até que um robot explorador com rodas pequenas lhe fez cócegas nas pedras e o fez sorrir.",
                "Os anéis de Saturno são feitos de milhões de pedrinhas de gelo brilhantes que rodam a alta velocidade, parecendo uma pista de patinagem mágica onde os extraterrestres gostam de brincar às escondidas.",
                "Durante a noite estrelada, uma pequena estrela cadente atravessou o céu muito depressa, deixando um rasto de poeira mágica e permitindo que todas as crianças da Terra fizessem um pedido especial.",
                "A nossa galáxia chama-se Via Láctea e parece um remoinho gigante cheio de luzes a piscar. É tão grande que nem a nave espacial mais rápida do mundo conseguiria percorrê-la numa vida inteira."
            ],
            musica: [
                "Na grande escola de música da floresta, o urso pardo tocava o tambor com muita força usando as suas patas enormes, enquanto o passarinho amarelo cantava melodias fininhas e muito doces.",
                "O velho piano de cauda do avô tinha teclas brancas e pretas que pareciam dentes mágicos. Quando carregávamos nelas com cuidado, ouviam-se sons tão bonitos que faziam o cão da família adormecer no tapete.",
                "Num concerto muito animado, o macaco pegou na guitarra roxa de seis cordas e começou a tocar tão depressa que todos os outros animais da selva começaram a saltar e a dançar à roda da fogueira.",
                "A menina pegou na sua flauta prateada, respirou fundo e soprou suavemente, criando uma música que parecia o som do vento a bater nas folhas do outono que caíam espalhadas pelo jardim de casa.",
                "O maestro da orquestra levantou a sua batuta fina de madeira, e de repente todos os violinos, violoncelos e trompetes começaram a tocar juntos uma canção que encheu a sala inteira de alegria."
            ],
            adivinhas: [
                "Sou uma casa muito especial e redondinha. Não tenho portas nem janelas, as minhas paredes são brancas e amarelas e quem me quiser abrir tem de me partir na borda da panela. Quem sou eu? Sou o ovo!",
                "Tenho uma coroa bonita mas não sou nenhum rei. Tenho o corpo cheio de escamas duras mas não sou um peixe a nadar no mar. Sou muito docinho por dentro e faço sumos maravilhosos. Sou o ananás!",
                "Corro muito depressa mas não tenho pernas. Assobio muito alto mas não tenho boca. Consigo levantar as folhas do chão mas ninguém me consegue ver nem agarrar com as mãos. Quem sou eu? Sou o vento!",
                "Nasço no meio das nuvens cinzentas e caio em pé no chão. Passo a vida a correr deitada pelas ruas até chegar ao mar grande e gosto de fazer crescer as plantas do teu jardim. Quem sou eu? Sou a chuva!",
                "Tenho quatro pernas fortes mas nunca consigo andar sozinha. Tenho umas costas onde te podes encostar, mas não falo nem respiro. Gosto de ficar à volta da mesa à espera da hora do jantar. Sou a cadeira!"
            ]
        };

        // LIGAÇÃO AOS ELEMENTOS DA PÁGINA
        const root = document.documentElement;
        const scrollingText = document.getElementById('scrolling-text');
        const customTextArea = document.getElementById('custom-text');
        
        const speedSlider = document.getElementById('speed-slider');
        const sizeSlider = document.getElementById('size-slider');
        const fontSelect = document.getElementById('font-select');
        const textColorPicker = document.getElementById('text-color');
        const bgColorPicker = document.getElementById('bg-color');

        // EVENTOS DOS CONTROLOS
        // Atualizar Velocidade
        speedSlider.addEventListener('input', (e) => {
            root.style.setProperty('--speed', e.target.value + 's');
        });

        // Atualizar Tamanho do Texto
        sizeSlider.addEventListener('input', (e) => {
            root.style.setProperty('--font-size', e.target.value + 'px');
        });

        // Atualizar Tipo de Letra
        fontSelect.addEventListener('change', (e) => {
            root.style.setProperty('--font-family', e.target.value);
        });

        // Atualizar Cor do Texto
        textColorPicker.addEventListener('input', (e) => {
            root.style.setProperty('--text-reading-color', e.target.value);
        });

        // Atualizar Cor do Fundo
        bgColorPicker.addEventListener('input', (e) => {
            root.style.setProperty('--reading-bg', e.target.value);
        });

        // Atualizar Texto quando o utilizador escreve
        customTextArea.addEventListener('input', (e) => {
            if (e.target.value.trim() !== '') {
                updateScrollingText(e.target.value);
            }
        });

        // FUNÇÕES MÁGICAS
        function setRandomText(tema) {
            const lista = textosMagicos[tema];
            const textoSorteado = lista[Math.floor(Math.random() * lista.length)];
            
            customTextArea.value = textoSorteado; // Mostra na caixa
            updateScrollingText(textoSorteado);   // Mete a rolar
        }

        // Reinicia a animação para o texto novo aparecer limpo da direita
        function updateScrollingText(novoTexto) {
            scrollingText.style.animation = 'none';
            scrollingText.offsetHeight; /* Força o navegador a reiniciar a animação */
            scrollingText.innerText = novoTexto;
            scrollingText.style.animation = `scrollText var(--speed) linear infinite`;
        }
    </script>
</body>
</html>
