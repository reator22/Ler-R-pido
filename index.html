<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitura Rápida Mágica</title>
    <!-- Importar fontes do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Comic+Neue:wght@700&family=Lora:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f9f4; /* Fundo geral muito suave */
            --panel-bg: #ffffff;
            --text-color: #333;
            --reading-bg: #fffdf2; /* Fundo creme claro para descanso visual */
            --speed: 15s; /* Velocidade base */
            --font-size: 80px; /* Tamanho base enorme */
            --font-family: 'Comic Neue', cursive;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: var(--text-color);
            overflow: hidden; /* Remove o scroll da página */
        }

        /* Painel de Controlo Compacto */
        #control-panel {
            background-color: var(--panel-bg);
            padding: 12px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: bold;
            color: #555;
        }

        input[type="range"], select {
            height: 28px;
            border-radius: 6px;
            border: 1px solid #ddd;
            cursor: pointer;
        }

        textarea {
            width: 220px;
            height: 38px;
            resize: none;
            border: 2px solid #eee;
            border-radius: 8px;
            padding: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        textarea:focus { border-color: #ffd700; outline: none; }

        .buttons-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            background-color: #ffd700;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.1s;
        }
        button:active { transform: scale(0.90); box-shadow: 0 2px 3px rgba(0,0,0,0.1); }
        button:hover { background-color: #ffea00; }

        .divider {
            height: 30px;
            width: 2px;
            background-color: #eee;
        }

        /* Área de Leitura Central */
        #reading-area {
            flex-grow: 1;
            background-color: var(--reading-bg);
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden; /* Essencial para o texto desaparecer nas bordas */
            border-top: 6px dashed #ffd700;
            border-bottom: 6px dashed #ffd700;
            margin: 20px;
            border-radius: 25px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.02);
        }

        #scrolling-text {
            white-space: nowrap; /* Impede o texto de quebrar de linha */
            position: absolute;
            font-size: var(--font-size);
            font-family: var(--font-family);
            color: #2c3e50;
            /* A animação usa a variável de velocidade CSS */
            animation: scrollText var(--speed) linear infinite;
        }

        /* Animação: começa à direita do ecrã e vai até a totalidade do texto sair pela esquerda */
        @keyframes scrollText {
            0% { left: 100%; transform: translateX(0); }
            100% { left: 0; transform: translateX(-100%); }
        }

        /* Ajustes para Telemóvel */
        @media (max-width: 800px) {
            #control-panel { flex-direction: column; align-items: stretch; gap: 12px; padding: 15px; }
            .control-group, .buttons-group { justify-content: space-between; width: 100%; }
            textarea { width: 100%; }
            .divider { display: none; }
            #reading-area { margin: 10px; border-radius: 15px; }
        }
    </style>
</head>
<body>

    <!-- PAINEL DE CONTROLO -->
    <div id="control-panel">
        
        <div class="control-group">
            <label for="speed-slider">🏃 Velocidade:</label>
            <!-- dir="rtl" inverte o slider: andar para a direita diminui os segundos (anda mais rápido) -->
            <input type="range" id="speed-slider" min="5" max="35" value="15" dir="rtl" title="Ajusta o ritmo de leitura"> 
        </div>

        <div class="control-group">
            <label for="size-slider">🔍 Tamanho:</label>
            <input type="range" id="size-slider" min="40" max="180" value="80" title="Ajusta o tamanho das letras">
        </div>

        <div class="control-group">
            <label for="font-select">✍️ Letra:</label>
            <select id="font-select">
                <option value="'Comic Neue', cursive">Escola Básica</option>
                <option value="'Lora', serif">Livro Clássico</option>
                <option value="'Caveat', cursive">Manuscrito (Portugal)</option>
            </select>
        </div>

        <div class="divider"></div>

        <div class="control-group">
            <textarea id="custom-text" placeholder="Escreve o teu texto aqui..."></textarea>
        </div>

        <div class="buttons-group">
            <span style="font-size: 14px; font-weight: bold; color: #555;">Magia:</span>
            <button onclick="setRandomText('dinossauros')" title="História de Dinossauros">🦖</button>
            <button onclick="setRandomText('espaco')" title="História do Espaço">🚀</button>
            <button onclick="setRandomText('musica')" title="História sobre Música">🎸</button>
            <button onclick="setRandomText('adivinhas')" title="Adivinhas">❓</button>
        </div>

    </div>

    <!-- ÁREA DE LEITURA -->
    <div id="reading-area">
        <div id="scrolling-text">Olá! Clica nos botões mágicos lá em cima para começarmos a ler!</div>
    </div>

    <script>
        // BANCO DE TEXTOS (Escritos em Português de Portugal)
        const textosMagicos = {
            dinossauros: [
                "O T-Rex tinha dentes muito afiados, mas os braços eram curtinhos.",
                "Os dinossauros viveram no nosso planeta há milhões de anos.",
                "O Triceratops tinha três chifres na cabeça para se proteger.",
                "Sabias que alguns dinossauros tinham penas coloridas como os pássaros?",
                "O Braquiossauro tinha um pescoço gigante para comer as folhas mais altas."
            ],
            espaco: [
                "A Lua gira à volta da Terra e brilha no céu escuro.",
                "O Sol é uma estrela gigante e muito quente que nos dá luz.",
                "Marte é conhecido como o planeta vermelho por causa da sua poeira.",
                "Os astronautas flutuam nas naves porque no espaço não há gravidade.",
                "Saturno é um planeta muito bonito que tem anéis brilhantes."
            ],
            musica: [
                "O piano tem muitas teclas brancas e pretas que fazem sons lindos.",
                "A guitarra tem seis cordas que vibram quando tocamos nelas.",
                "O tambor faz um som muito forte e ajuda a marcar o ritmo da festa.",
                "As notas musicais sobem e descem para formar uma melodia bonita.",
                "Cantar ajuda a ficar feliz e a partilhar alegria com os amigos."
            ],
            adivinhas: [
                "O que é que cai em pé e corre deitado? É a chuva!",
                "Qual é a coisa qual é ela que tem dentes mas não morde? É o alho!",
                "O que é que quanto mais cresce menos se vê? É a escuridão!",
                "Tem coroa mas não é rei, tem escamas mas não é peixe. É o ananás!",
                "O que é que tem de ser partido antes de ser usado? É o ovo!"
            ]
        };

        // LIGAÇÃO AOS ELEMENTOS DA PÁGINA
        const root = document.documentElement;
        const scrollingText = document.getElementById('scrolling-text');
        const customTextArea = document.getElementById('custom-text');
        
        const speedSlider = document.getElementById('speed-slider');
        const sizeSlider = document.getElementById('size-slider');
        const fontSelect = document.getElementById('font-select');

        // EVENTOS DOS CONTROLOS
        // Atualizar Velocidade
        speedSlider.addEventListener('input', (e) => {
            root.style.setProperty('--speed', e.target.value + 's');
        });

        // Atualizar Tamanho do Texto
        sizeSlider.addEventListener('input', (e) => {
            root.style.setProperty('--font-size', e.target.value + 'px');
        });

        // Atualizar Tipo de Letra
        fontSelect.addEventListener('change', (e) => {
            root.style.setProperty('--font-family', e.target.value);
        });

        // Atualizar Texto quando o utilizador escreve
        customTextArea.addEventListener('input', (e) => {
            if (e.target.value.trim() !== '') {
                updateScrollingText(e.target.value);
            }
        });

        // FUNÇÕES MÁGICAS
        // Escolhe um texto aleatório da categoria e coloca a passar
        function setRandomText(tema) {
            const lista = textosMagicos[tema];
            const textoSorteado = lista[Math.floor(Math.random() * lista.length)];
            
            customTextArea.value = textoSorteado; // Mostra na caixa
            updateScrollingText(textoSorteado);   // Mete a rolar
        }

        // Reinicia a animação para o texto novo aparecer limpo da direita
        function updateScrollingText(novoTexto) {
            scrollingText.style.animation = 'none';
            scrollingText.offsetHeight; /* Força o navegador a reiniciar a animação */
            scrollingText.innerText = novoTexto;
            scrollingText.style.animation = `scrollText var(--speed) linear infinite`;
        }
    </script>
</body>
</html>

```
